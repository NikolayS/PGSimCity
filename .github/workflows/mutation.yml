name: Mutation gate

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mutation-gate
  cancel-in-progress: false

jobs:
  mutation:
    name: Audit critical mutation targets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Run mutation gate serially
        id: mutation
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -o pipefail
          npm run mutation -- --maxWorkers=1 2>&1 | tee /tmp/pgsimcity-mutation.md

      - name: Reconcile mutation survivor issue
        if: always() && steps.mutation.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          MUTATION_REPORT: /tmp/pgsimcity-mutation.md
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- pgsimcity-mutation-gate -->'
            const title = 'Mutation gate survivors'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) =>
              !issue.pull_request && issue.title === title && issue.body?.includes(marker))
            const outcome = process.env.MUTATION_OUTCOME

            if (outcome === 'failure') {
              const reportPath = process.env.MUTATION_REPORT
              const report = fs.existsSync(reportPath)
                ? fs.readFileSync(reportPath, 'utf8').slice(0, 50_000)
                : 'The mutation gate failed before it produced a report.'
              const body = [
                marker,
                '',
                'The scheduled critical-target mutation gate found a surviving mutant or an inconclusive skip. Treat every survivor as a missing defense; do not tune the operator away. A skip is not evidence of safety.',
                '',
                `- Workflow run: [${context.runId}](${runUrl})`,
                `- Commit: ${context.sha}`,
                '',
                report,
              ].join('\n')

              if (existing) {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: existing.number,
                  body,
                })
                core.notice(`Updated issue #${existing.number}`)
              } else {
                const created = await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body,
                })
                core.notice(`Opened issue #${created.data.number}`)
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `The mutation gate returned to green in [workflow run ${context.runId}](${runUrl}).`,
              })
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: 'closed',
              })
              core.notice(`Closed recovered issue #${existing.number}`)
            }

      - name: Fail on a surviving or inconclusive mutant
        if: steps.mutation.outcome == 'failure'
        run: exit 1
