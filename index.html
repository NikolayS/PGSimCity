<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="PGSimCity — an explorable 3D city that shows how PostgreSQL actually works." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060c" />
    <title>PGSimCity · How PostgreSQL Works, in 3D</title>

    <!-- ============ icons ============ -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon-180.png" sizes="180x180" />

    <!-- ============ social preview ============ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PGSimCity" />
    <meta property="og:title" content="PGSimCity · How PostgreSQL Works, in 3D" />
    <meta
      property="og:description"
      content="An explorable 3D city that shows how PostgreSQL actually works — backends, shared buffers, WAL, checkpoints, autovacuum and replication, all running live in your browser."
    />
    <meta property="og:url" content="https://nikolays.github.io/PGSimCity/" />
    <meta property="og:image" content="https://nikolays.github.io/PGSimCity/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The PGSimCity elephant mark beside a night-time 3D model of a PostgreSQL cluster laid out as a city."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PGSimCity · How PostgreSQL Works, in 3D" />
    <meta
      name="twitter:description"
      content="An explorable 3D city that shows how PostgreSQL actually works — backends, shared buffers, WAL, checkpoints, autovacuum and replication, all running live in your browser."
    />
    <meta name="twitter:image" content="https://nikolays.github.io/PGSimCity/og.png" />
    <meta
      name="twitter:image:alt"
      content="The PGSimCity elephant mark beside a night-time 3D model of a PostgreSQL cluster laid out as a city."
    />
  </head>
  <body>
    <!-- ============ WebGL canvas mounts here ============ -->
    <div id="stage">
      <div id="canvas-root"></div>
      <!-- CSS2DRenderer output is appended here by engine/labels.ts -->
      <div id="labels-root" aria-hidden="true"></div>
    </div>

    <!-- ============ HUD layers (filled by src/ui/*) ============ -->
    <div id="hud">
      <header id="hud-top"></header>
      <aside id="hud-left"></aside>
      <aside id="hud-right"></aside>
      <footer id="hud-bottom"></footer>
      <div id="tour-layer"></div>
      <div id="toast-stack"></div>
      <div id="help-overlay" hidden></div>
      <div id="compass"></div>
    </div>

    <!-- ============ Boot screen ============ -->
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-mark">
          <svg viewBox="0 0 100 100" width="86" height="86" role="img" aria-label="PGSimCity">
            <defs>
              <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5ad1ff" />
                <stop offset="100%" stop-color="#7b6cff" />
              </linearGradient>
            </defs>
            <!-- blueprint hex the whole model is drawn inside -->
            <path
              d="M50 3 L90.7 26.5 L90.7 73.5 L50 97 L9.3 73.5 L9.3 26.5 Z"
              fill="rgba(7,13,24,.55)"
              stroke="url(#bg1)"
              stroke-width="2.4"
            />
            <!-- the elephant: same mark as public/favicon.svg, 64-unit box -->
            <g transform="translate(18 18) scale(1)">
              <path
                fill="url(#bg1)"
                d="M9.9 25.3 C9.2 15.8 13.3 7.1 22.4 4.4 C28.8 2.4 33.6 3.7 36.4 6.6 C39.6 4.2 44.4 3.1 49 3.7 C57.2 4.4 62.4 10.6 62.4 19.8 C62.4 27.4 60.4 34.8 56.2 41.2 C53 46 48.8 49.8 44.4 51 C41.2 51.8 39.6 50.4 38.6 47.6 C37.2 44 35.8 41.2 33.8 39.5 C31.1 37.2 28.8 36.5 26.3 36.3 C26.5 40.8 25.8 45.4 24 49.7 C22.2 54.1 19 57.7 14.7 59.5 C9.9 61.6 5.3 60 3.5 56.3 C2.1 53.1 4.2 50.2 7.4 49.5 C9 49.2 9.9 48.1 10.2 46.5 C11 38.6 11 32.2 9.9 25.3 Z"
              />
              <path
                fill="#dbe7ff"
                d="M24.6 35 C26.4 40.4 24.6 46.6 19.9 51.1 C16.6 54.2 12.6 55.6 9.3 54.6 C13.6 53 17.3 49.7 19 45.6 C20.2 42.6 20.8 38.8 20.4 35 Z"
              />
              <circle cx="19.6" cy="20.8" r="2.6" fill="#04060c" opacity=".9" />
            </g>
          </svg>
        </div>
        <h1 class="boot-title">PG<span>SimCity</span></h1>
        <p class="boot-sub">A working model of the PostgreSQL engine</p>
        <div class="boot-bar"><i id="boot-fill"></i></div>
        <p class="boot-status" id="boot-status">assembling shared memory…</p>
      </div>
    </div>

    <noscript>
      <div style="padding:2rem;font:16px system-ui;color:#dbe7ff;background:#05070d">
        PGSimCity needs JavaScript and WebGL2 to run.
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
